commands:
  - type: revng.test-segment-references
    from:
      - type: revng-qa.compiled-with-debug-info
        filter: for-segment-references
    suffix: /
    command: |-
      revng artifact --analyze cleanup-ir "$INPUT" |
        revng opt -S | FileCheck ${SOURCE}.filecheck.ll;
