commands:
  - type: revng.test-import-pe
    from:
      - type: revng-qa.compiled
        filter: for-import-pe
      - type: revng-qa.generated-pdb
        filter: for-import-pe
    command: |-
      revng2 quick analyze --analyses=parse-binary "$INPUT1" -- --use-pdb="$INPUT2"
        | revng model hard-purge "${COMMAND_ROOT}/${SOURCE}.model.yml"
        | revng model compare "${COMMAND_ROOT}/${SOURCE}.model.yml"
